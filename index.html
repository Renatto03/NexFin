<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>financas</title>

    <link rel="stylesheet" href="style.css">

</head>
<body>

    <header>
        <h1>Finanças</h1>
        <p>Controle de finanças pessoais</p>
    </header>
    
    <main>
        <section>
            <h2>Saldo atual</h2>
            <p id="saldo">R$ 0,00</p>
            <p>Receitas: <span id="total-receitas">R$ 0,00</span></p>
            <p>Despesas: <span id="despesas">R$ 0,00</span></p>
        </section>

        <section>
            <h2>Nova transação</h2>


    <form id="formulario">
        <p>
            <label for="descricao">Descrição:</label>
            <input type="text" id="descricao" name="descricao" required placeholder="Digite a descrição da transação">
        </p>

        <p>
            <label for="valor">Valor (R$):</label>
            <input type="number" id="valor" name="valor" step="0.01" min="0.01" required placeholder="Digite o valor da transação">
        </p>

        <p>
            <label for="tipo">Tipo:</label>
            <select id="tipo" name="tipo" required>  
                <option value="receita">Receita</option>
                <option value="despesa">Despesa</option>
            </select>
        </p>

            <button type="submit">Adicionar</button>
        </form>
        </section>

        <section>
            <h2>Movimentação</h2>
            <ul id="movimentacoes"></ul>
        </section>

    </main>

    <script src="script.js"></script>
</body>
</html>
